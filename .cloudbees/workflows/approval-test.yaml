apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: approval-test
on:
  workflow_dispatch:
jobs:
  build:
    steps:
      - name: Say hello
        uses: docker://golang:1.20.3-alpine3.17
        shell: sh
        run: |
          echo "hello world"
    needs:
      - approve_me
  approve_me:
    with:
      instructions: ""
      disallowLaunchByUser: false
      approvers: 8509888e-d27f-44fa-46a9-29bc76f5e790
      notifyAllEligibleUsers: false
    timeout-minutes: 5
    delegates: cloudbees-io/manual-approval/custom-job.yml@v1


